# Solution artefact for "Run a DoD gate".
#
# Synthetic. Note what is NOT here: no thresholds, no critical slices, no
# vetoes. A DoD gate asserts; it has nothing to average and nothing to
# override. `thresholds: {}` is the correct value, not an unfinished one.

evaluation:
  id: claimtriage-deterministic-contract
  version: 1.0.0
  framework: DoD

candidate:
  name: mock-triage-service
  version: 2.3.0
  frozen: true

candidate_adapter:
  type: mock

evaluation_data:
  path: ../data/claimtriage-dod-dataset.jsonl
  version: 1.0.0
  anonymisation: synthetic

evaluators:
  - id: response-contract
    type: schema_conformance
    gate: DoD
    version: 1.0.0
  - id: queue-routing
    type: exact_values
    gate: DoD
    version: 1.0.0

execution:
  repetitions: 1

acceptance:
  thresholds: {}
  critical_slices: []
  vetoes: []

evidence:
  output_dir: evidence

ownership:
  # Fictional roles for the exercise. A DoD gate still has an owner: someone
  # is accountable for the specification the assertions are derived from.
  decision_owner: engineering lead, claims triage
  approved_by: engineering lead, claims triage
  approved_on: 2026-07-31
