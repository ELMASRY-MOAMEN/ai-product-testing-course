# Synthetic. The candidate is a mock and the values below are approved for
# this example only. They demonstrate the shape of an approved manifest and
# must never be reused as defaults for a real evaluation.
#
# This example travels with the skill: copy the skill folder alone into
# another repository and it still runs.

evaluation:
  id: mock-ticket-summary
  version: 1.0.0
  framework: DoT

candidate:
  name: mock-summariser
  version: 1.0.0
  frozen: true

candidate_adapter:
  type: mock

evaluation_data:
  path: dataset.jsonl
  version: 1.0.0
  anonymisation: synthetic

evaluators:
  - id: required-facts-recall
    type: required_facts_recall
    gate: DoT
    version: 1.0.0
  - id: unsupported-claim
    type: forbidden_claims
    gate: DoT
    version: 1.0.0

execution:
  repetitions: 1

acceptance:
  thresholds:
    required-facts-recall: 0.85
  critical_slices:
    - name: sensitive
      evaluator: required-facts-recall
      minimum: 0.90
  vetoes:
    - evaluator: unsupported-claim
      condition: any_triggered

evidence:
  output_dir: evidence

ownership:
  # Fictional, and the reason it is stated here rather than in a header comment:
  # an agent following this example filled these fields with a plausible role
  # name and shipped a runnable manifest, citing this file as precedent. In a
  # real engagement, an ownership section completed without a recorded approval
  # leaves the manifest Not Ready — a name typed into a field is not a sign-off,
  # and inferring one is the invention every rule here forbids.
  decision_owner: product owner, ticket-summary capability
  approved_by: product owner, ticket-summary capability
  approved_on: 2026-07-29
