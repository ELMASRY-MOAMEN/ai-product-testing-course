# Synthetic. The candidate is a mock and the values below are approved for
# this example only.
#
# Hybrid: the DoD evaluators assert, the DoT evaluators measure, and
# acceptance requires both gates. A DoD evaluator carries no threshold,
# because there is nothing to average — an assertion holds or it does not.

evaluation:
  id: hr-agent-hybrid
  version: 1.0.0
  framework: Hybrid

candidate:
  name: mock-hr-agent
  version: 1.0.0
  frozen: true

candidate_adapter:
  type: mock

evaluation_data:
  path: dataset.jsonl
  version: 1.0.0
  anonymisation: synthetic

evaluators:
  - id: output-schema
    type: schema_conformance
    gate: DoD
    version: 1.0.0
  - id: tool-call
    type: tool_call_conformance
    gate: DoD
    version: 1.0.0
  - id: answer-facts-recall
    type: required_facts_recall
    gate: DoT
    version: 1.0.0
  - id: unsupported-claim
    type: forbidden_claims
    gate: DoT
    version: 1.0.0

execution:
  repetitions: 1

acceptance:
  thresholds:
    answer-facts-recall: 0.85
  critical_slices:
    - name: ticket-action
      evaluator: answer-facts-recall
      minimum: 0.85
  vetoes:
    - evaluator: unsupported-claim
      condition: any_triggered

evidence:
  output_dir: evidence

ownership:
  # Fictional, and the reason it is stated here rather than in a header comment:
  # an agent following this example filled these fields with a plausible role
  # name and shipped a runnable manifest, citing this file as precedent. In a
  # real engagement, an ownership section completed without a recorded approval
  # leaves the manifest Not Ready — a name typed into a field is not a sign-off,
  # and inferring one is the invention every rule here forbids.
  decision_owner: product owner, HR agent
  approved_by: product owner, HR agent
  approved_on: 2026-07-29
